<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>검강화 – 100억의 대장간</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;900&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#0a090d;--ink:#ece6d8;--mute:#8e879a;--line:#2b2733;--panel:#14111a;--gold:#d9b45c;--c:#9a9ca3;color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR',system-ui,sans-serif;min-height:100svh}
.wrap{display:grid;grid-template-columns:1.15fr .85fr;min-height:100svh}
.stage{position:relative;overflow:hidden;background:radial-gradient(ellipse at 50% 55%,color-mix(in srgb,var(--c) 30%,transparent),transparent 62%),#08070b;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:20px 20px 28px;min-height:62svh;transition:background .6s}
.stage h1{position:absolute;top:20px;left:24px;margin:0;font:900 26px 'Noto Serif KR',serif;letter-spacing:.12em;background:linear-gradient(#f6e3a6,#b88a2e);-webkit-background-clip:text;background-clip:text;color:transparent}
#sv{position:absolute;inset:0;width:100%;height:100%;z-index:1}
.pt{position:absolute;inset:0;z-index:2;pointer-events:none}
.pt i{position:absolute;bottom:-10px;width:var(--s);height:var(--s);border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);animation:rise var(--d) linear var(--l) infinite}
.pt.rn{animation:hue 5s linear infinite}
@keyframes rise{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(-70svh);opacity:0}}
.caption{position:relative;z-index:3;text-align:center;text-shadow:0 2px 18px #000}
.lv{font:900 64px/1 'Noto Serif KR',serif;color:var(--c);transition:color .5s}
.nm{font:600 17px 'Noto Serif KR',serif;letter-spacing:.2em;margin-top:6px}
.stage::before{content:'';position:absolute;inset:22px;border:1px solid rgba(217,180,92,.22);z-index:5;pointer-events:none}
.stage::after{content:'';position:absolute;inset:0;z-index:5;pointer-events:none;box-shadow:inset 0 0 120px rgba(0,0,0,.75);background:linear-gradient(180deg,rgba(0,0,0,.25),transparent 30%,transparent 70%,rgba(0,0,0,.45))}
.lv{background:linear-gradient(#fffbe8,#f0cf7a 45%,#9a6f22);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 2px 14px rgba(255,214,120,.35));letter-spacing:.04em}
.nm{color:#e9d9a8;font-weight:600;letter-spacing:.28em;font-size:15px}
.nm::before,.nm::after{content:'';display:inline-block;width:36px;height:1px;background:linear-gradient(90deg,transparent,#d9b45c);vertical-align:middle;margin:0 12px}
.nm::after{transform:scaleX(-1)}
.stage.charge #sv{animation:shake .12s linear infinite}
.stage.break #sv{animation:brk .45s ease-out forwards}
@keyframes shake{0%,100%{transform:translateX(0)}50%{transform:translateX(3px)}}
@keyframes brk{0%{filter:brightness(3)}100%{opacity:0;transform:scale(1.15) rotate(6deg);filter:blur(10px) saturate(3)}}
#flash{position:absolute;inset:0;z-index:4;pointer-events:none;opacity:0}
#flash.on{animation:fl .4s ease-out}
@keyframes fl{0%{opacity:.95}100%{opacity:0}}
.spin{animation:sp 24s linear infinite}.spin2{animation:sp 40s linear infinite reverse}
@keyframes sp{to{transform:rotate(360deg)}}
.nrn .rn{animation:none}
.wv{animation:wv 3.2s ease-out infinite;transform-origin:100px 190px}@keyframes wv{from{transform:scale(.15);opacity:.9}to{transform:scale(2.6);opacity:0}}
.fa{animation:fall var(--d) linear var(--l) infinite}@keyframes fall{from{transform:translate(var(--x),-40px) rotate(0)}to{transform:translate(calc(var(--x) + 40px),440px) rotate(240deg)}}
.rn{animation:hue 5s linear infinite}
@keyframes hue{from{filter:drop-shadow(0 0 22px #ffd45a) hue-rotate(0)}to{filter:drop-shadow(0 0 22px #ffd45a) hue-rotate(360deg)}}
.pl{animation:pulse 1.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{50%{transform:scale(1.35);opacity:.7}}
.bolt{animation:bolt .5s steps(2) infinite}
.sw{animation:sw 2.4s linear infinite}
@keyframes sw{from{transform:translateY(40px)}to{transform:translateY(-380px)}}
@keyframes bolt{50%{opacity:0}}
.panel{padding:28px clamp(18px,3vw,40px);background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;gap:18px}
.cash small{color:var(--mute);font-size:13px}
.cash b{display:block;font:900 30px 'Noto Serif KR',serif;color:var(--gold);margin-top:2px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar div{height:100%;width:0;background:linear-gradient(90deg,#7a5a1c,var(--gold),#fff1c2);transition:width .5s}
dl{margin:0;display:grid;grid-template-columns:auto 1fr;gap:10px 16px;font-size:15px}
dt{color:var(--mute)}dd{margin:0;text-align:right;font-weight:500}
.btns{display:grid;grid-template-columns:2fr 1fr;gap:10px}
button{font:700 16px 'Noto Sans KR',sans-serif;border-radius:8px;padding:16px;cursor:pointer;border:1px solid var(--line);background:#1d1925;color:var(--ink)}
button:hover:not(:disabled){border-color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.4;cursor:not-allowed}
#go{background:linear-gradient(#e7c56d,#a8781f);color:#1a1204;border:0;font-size:18px}
#log{flex:1;min-height:140px;max-height:260px;overflow:auto;margin:0;padding:0;list-style:none;font-size:14px;line-height:1.6;border-top:1px solid var(--line);padding-top:12px}
#log li{padding:2px 0}.ok{color:#8fe3a8}.no{color:#ff9a9a}.bk{color:#ff5c5c;font-weight:700}.gd{color:var(--gold)}.in{color:var(--mute)}
.auto{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.auto button{padding:12px 4px;font-size:14px}
.reset{background:none;border:0;color:var(--mute);font-size:13px;padding:4px;align-self:flex-start;font-weight:400}
@media(max-width:820px){.wrap{grid-template-columns:1fr}.stage{min-height:58svh}.panel{border-left:0;border-top:1px solid var(--line)}.lv{font-size:48px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <section class="stage" id="stage">
    <h1>검강화</h1>
    <svg id="sv" viewBox="-70 -50 340 470" preserveAspectRatio="xMidYMid meet"></svg>
    <div class="pt" id="pt"></div>
    <div id="flash"></div>
    <div class="caption"><div class="lv" id="lv">+0</div><div class="nm" id="nm"></div></div>
  </section>
  <aside class="panel">
    <div class="cash"><small>보유 현금</small><b id="cash"></b></div>
    <div class="bar"><div id="bar"></div></div>
    <dl>
      <dt>강화 비용</dt><dd id="cost"></dd>
      <dt>성공 확률</dt><dd id="rate"></dd>
      <dt>파괴 확률</dt><dd id="des"></dd>
      <dt>판매 시세</dt><dd id="sell"></dd>
      <dt>행운</dt><dd id="lk"></dd>
      <dt>파괴된 검</dt><dd id="dc"></dd>
    </dl>
    <div class="btns"><button id="go">강화하기</button><button id="sl">판매</button></div>
    <div class="auto"><button id="a10">연속 +10</button><button id="a100">연속 +100</button><button id="a1000">연속 +1000</button><button id="a10000">연속 +10000</button><button id="a100000">연속 +100000</button><button id="a1000000">연속 +1000000</button><button id="st">중지</button><button id="mn">💰 +400해</button><button id="mn2">💰 +4000무량대수</button></div>
    <ul id="log"></ul>
    <button class="reset" id="rs">처음부터 다시</button>
  </aside>
</div>
<script>
const PAL=[[220,4],[215,12],[150,55],[185,70],[215,80],[270,65],[320,75],[2,80],[25,90],[45,90],[45,95]];
const NAMES=['녹슨 철검','단련된 강철검','청록 비취검','빙결의 서리검','푸른 달빛검','자수정 마검','진홍 혈검','업화의 대검','황혼의 성검','황금 용왕검','신화의 검 · 아스트라'];
const START=1999e16;
let S,busy=false,lastLv=-1,autoOn=false,stopFlag=false;
const $=id=>document.getElementById(id);
const cost=n=>Math.round(500*Math.pow(1+n,3)/10)*10;
const LUCK=1000000000;
const rate=n=>n<3?100:Math.min(100,Math.max(3,98-n*.4)+LUCK*0.04);
const dest=n=>n>=25?Math.min(25,n-24)*Math.max(0,1-LUCK/1250):0;
const sellP=n=>n?Math.round(cost(n)*2.2/10)*10:0;
const won2=n=>{let r=BigInt(Math.round(n)),o=[];for(const[u,k]of[[10n**68n,'무량대수'],[10n**64n,'불가사의'],[10n**60n,'나유타'],[10n**56n,'아승기'],[10n**52n,'항하사'],[10n**48n,'극'],[10n**44n,'재'],[10n**40n,'정'],[10n**36n,'간'],[10n**32n,'구'],[10n**28n,'양'],[10n**24n,'자'],[10n**20n,'해'],[10n**16n,'경'],[10n**12n,'조'],[10n**8n,'억'],[10n**4n,'만']]){const q=r/u;r%=u;if(q)o.push(q.toLocaleString()+k)}if(r)o.push(r.toLocaleString());return o.slice(0,3).join(' ')+'원'};
const won=n=>{if(n>=1e8)return won2(n);n=Math.round(n);if(n>=1e8){const e=Math.floor(n/1e8),m=Math.floor(n%1e8/1e4);return e+'억'+(m?' '+m.toLocaleString()+'만':'')+'원'}
 if(n>=1e4){const m=Math.floor(n/1e4),r=n%1e4;return m.toLocaleString()+'만'+(r?' '+r.toLocaleString():'')+'원'}return n.toLocaleString()+'원'};
function log(t,c=''){const li=document.createElement('li');li.className=c;li.textContent=t;$('log').prepend(li)}

const CN=['진홍','주황','황금','연두','비취','청록','하늘','쪽빛','보라','자수정','자홍','장미'],SN=['직검','나뭇잎검','월도','대검','톱날검','곡도','화염검','계단 대검','수정검','레이피어','할검'];
const hueOf=L=>(L*137.5+20)%360;
const nameOf=L=>L===50?NAMES[10]:(L<5?'녹슨':CN[hueOf(L)/30|0])+' '+SN[L%11]+(L>=40?' · 절대':L>=25?' · 고대':'');
function wingsBack(){let o='';for(let i=0;i<7;i++){const d=`M0,0 Q40,-16 ${90+i*10},${-4-i*2} Q50,12 0,0Z`;[1,-1].forEach(sg=>{o+=`<path d='${d}' transform='translate(100 225) scale(${sg} 1) rotate(${-6-i*13})' fill='url(#wg)' stroke='#fff' stroke-opacity='.5'/>`})}
 return `<defs><linearGradient id='wg' x1='0' x2='1'><stop offset='0' stop-color='#fff'/><stop offset='1' stop-color='#ffd45a' stop-opacity='.25'/></linearGradient></defs><g class='rn'>${o}</g>`}
const WN=['직검','나뭇잎검','월도','대검','톱날검','곡도','화염검','계단 대검','수정검','레이피어','할검','사신의 낫','전투 도끼','장창','삼지창','반월 언월도'];
const nameOf2=L=>L>=1000?NAMES[10]:(L<5?'녹슨':CN[hueOf(L)/30|0])+' '+WN[L%16]+(L>=800?' \u00b7 신화':L>=500?' \u00b7 전설':L>=250?' \u00b7 천상':L>=100?' \u00b7 절대':L>=40?' \u00b7 고대':'');
const EN=['','톱날 ','화염 ','수정 ','가시 ','월식 '],BN=['장검','나뭇잎검','대검','계단 대검','곡도','레이피어','할검','팔콘검'],WP=['사신의 낫','전투 도끼','장창','삼지창','반월 언월도','철퇴','전쟁 망치','쌍낫'];
const nameOf3=L=>{if(L>=1000000)return '영원의 검 · 알파 ∞';if(L===100000)return '열반의 검 · 오메가 ∞';if(L===10000)return '창세의 검 · 아스트라 ∞';const c=L%32,nm=c<24?EN[(c>>3)*2+(L>>5&1)]+BN[c%8]:WP[c-24];return (L<5?'녹슨 ':CN[hueOf(L)/30|0]+' ')+nm+(L>=6000?' · 창세':L>=3000?' · 영겁':L>=1000?' · 초월':L>=500?' · 신화':L>=250?' · 전설':L>=100?' · 절대':L>=40?' · 고대':'')};
function finalSword(){
 const q=i=>{const x=Math.sin(i*91.7)*43758.5453;return x-Math.floor(x)};
 let stars='';for(let i=0;i<90;i++)stars+=`<circle class='${i%3?'':'pl'}' style='animation-delay:${(q(i+5)*2).toFixed(1)}s' cx='${(-70+q(i)*340).toFixed(0)}' cy='${(-50+q(i+9)*470).toFixed(0)}' r='${(.6+q(i+3)*1.6).toFixed(1)}' fill='#fff' opacity='${(.4+q(i+7)*.6).toFixed(2)}'/>`;
 let gal='';for(let a=0;a<2;a++){let d='';for(let t=0;t<260;t+=6){const th=t/22+a*Math.PI,r=8+t*.55;d+=`${(100+Math.cos(th)*r).toFixed(0)},${(180+Math.sin(th)*r*.45).toFixed(0)} `}gal+=`<polyline points='${d}' fill='none' stroke='${a?'#ff5fd2':'#5fe0ff'}' stroke-width='2' opacity='.45'/>`}
 const Rt=[[100,-30],[113,40],[126,66],[121,112],[134,156],[127,236],[121,318]],pts=Rt.concat(Rt.slice(1).reverse().map(([x,y])=>[200-x,y])).map(p=>p.join(',')).join(' ');
 let rn='';for(let i=0;i<6;i++){const y=50+i*42;rn+=`<path d='M100,${y-7} l5,7 l-5,7 l-5,-7z' fill='#fff' class='pl' style='animation-delay:${i*.2}s'/>`}
 let sh='';for(let i=0;i<6;i++){const x=i%2?150+i*6:50-i*6,y=30+i*48;sh+=`<path class='pl' style='animation-delay:${i*.3}s' d='M${x},${y-10} l5,10 l-5,10 l-5,-10z' fill='${i%2?'#ff5fd2':'#5fe0ff'}' stroke='#fff'/>`}
 let wf='';for(let k=0;k<5;k++){const d=`M108,322 Q${150+k*8},${300-k*14} ${190+k*14},${280-k*20}`;wf+=`<path d='${d}'/><path d='${d}' transform='translate(200 0) scale(-1 1)'/>`}
 return `<defs><linearGradient id='fb' x1='0' y1='1' x2='0' y2='0'><stop offset='0' stop-color='#0a0420'/><stop offset='.4' stop-color='#3b1480'/><stop offset='.75' stop-color='#1b5fc4'/><stop offset='1' stop-color='#c9f4ff'/></linearGradient><linearGradient id='fe' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#fff'/><stop offset='.5' stop-color='#ffe27a'/><stop offset='1' stop-color='#ff9ad9'/></linearGradient><radialGradient id='fg'><stop offset='0' stop-color='#fff'/><stop offset='.4' stop-color='#5fe0ff'/><stop offset='1' stop-color='#7a2cff'/></radialGradient><radialGradient id='fh'><stop offset='0' stop-color='#9a5cff' stop-opacity='.5'/><stop offset='1' stop-color='#9a5cff' stop-opacity='0'/></radialGradient><clipPath id='fc'><polygon points='${pts}'/></clipPath></defs>${stars}<ellipse cx='100' cy='190' rx='170' ry='230' fill='url(#fh)'/>
 <g class='spin' style='transform-origin:100px 180px;animation-duration:60s'>${gal}</g>
 <g class='rn'>${wingsBack()}</g>
 <circle class='spin2' style='transform-origin:100px 190px' cx='100' cy='190' r='165' fill='none' stroke='#ffd45a' stroke-width='2' stroke-dasharray='16 10' opacity='.7'/>
 <ellipse cx='100' cy='190' rx='185' ry='38' fill='none' stroke='#ffe27a' stroke-width='2' opacity='.55' transform='rotate(-22 100 190)'/><circle cx='252' cy='132' r='9' fill='#ffb85a' stroke='#fff'/>
 <g class='rn' style='filter:drop-shadow(0 0 16px #8a5cff) drop-shadow(0 0 30px #5fe0ff)'>
  <polygon points='${pts}' fill='url(#fb)'/>
  <g clip-path='url(#fc)'><g class='spin' style='transform-origin:100px 200px;animation-duration:30s'><ellipse cx='70' cy='120' rx='40' ry='24' fill='#ff5fd2' opacity='.35'/><ellipse cx='135' cy='230' rx='45' ry='26' fill='#5fe0ff' opacity='.35'/><ellipse cx='100' cy='40' rx='30' ry='20' fill='#fff' opacity='.3'/></g>${stars}<g transform='rotate(-20 100 190)'><rect class='sw' x='-20' y='318' width='240' height='16' fill='#fff' opacity='.45'/></g></g>
  <polygon points='${pts}' fill='none' stroke='url(#fe)' stroke-width='3' stroke-linejoin='round'/>
  <line x1='100' y1='-20' x2='100' y2='312' stroke='#fff' stroke-opacity='.8' stroke-width='2'/>${rn}${sh}
  <g fill='none' stroke='url(#fe)' stroke-width='5' stroke-linecap='round'>${wf}</g>
  <path d='M100,300 L192,284 L180,332 L100,327 L20,332 L8,284Z' fill='#d9a82e' stroke='#fff3b8' stroke-width='2'/>
  <rect x='93' y='330' width='14' height='58' rx='3' fill='#1b0b3a'/>${[0,1,2,3].map(i=>`<rect x='91' y='${336+i*13}' width='18' height='4' fill='#ffd45a'/>`).join('')}
  <polygon points='100,386 106,396 118,398 108,405 111,418 100,410 89,418 92,405 82,398 94,396' fill='#ffd45a' stroke='#fff'/>
  <circle class='pl' cx='100' cy='312' r='13' fill='url(#fg)' stroke='#fff' stroke-width='2'/>
  <path class='pl' d='M100,-50 L105,-34 L124,-30 L105,-26 L100,-8 L95,-26 L76,-30 L95,-34Z' fill='#fff'/>
 </g>`;
}
function divine(s,L){
 const sz=Math.min(L,150),tip=318-(120+sz*.95),p=Math.min(1,L/3000),op=(.3+p*.6).toFixed(2),ws=(.85+Math.min(1,L/1500)*.45).toFixed(2),g=20+sz*.28;
 let ma='';for(let i=0;i<6;i++){const a=i*Math.PI/3;ma+=`<circle cx='${(100+Math.cos(a)*45).toFixed(1)}' cy='${(190+Math.sin(a)*45).toFixed(1)}' r='45'/>`}
 const wing=`<path d='M100,322 Q${100+g*.7},${296} ${100+g},${282} Q${100+g*.75},${312} ${100+g*.5},${330} L100,326Z' fill='url(#dg)' stroke='#fff3b8' stroke-width='1.5'/><path d='M100,318 Q${100+g*.5},${300} ${100+g*.85},${296} Q${100+g*.5},${316} 100,324Z' fill='#fff8d0' opacity='.8'/>`;
 const back=`<defs><linearGradient id='dp' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#fff6c8' stop-opacity='0'/><stop offset='.5' stop-color='#fff6c8' stop-opacity='.5'/><stop offset='1' stop-color='#ffd45a' stop-opacity='.1'/></linearGradient><linearGradient id='dg' x1='0' y1='0' x2='0' y2='1'><stop offset='0' stop-color='#fff8d0'/><stop offset='.5' stop-color='#f0c24a'/><stop offset='1' stop-color='#a8761c'/></linearGradient></defs><rect x='76' y='-50' width='48' height='470' fill='url(#dp)' opacity='${op}'/><g class='spin' style='transform-origin:100px 190px;animation-duration:80s' fill='none' stroke='#ffe08a' stroke-width='1' opacity='${op}'>${ma}<circle cx='100' cy='190' r='90'/></g><g class='nrn' opacity='.75' transform='translate(100 225) scale(${ws}) translate(-100 -225)'>${wingsBack()}</g>`;
 const front=`<g style='filter:drop-shadow(0 0 6px #ffd45a)'>${wing}<g transform='translate(200 0) scale(-1 1)'>${wing}</g><circle cx='100' cy='318' r='10' fill='none' stroke='#ffe27a' stroke-width='2.5'/><circle class='pl' cx='100' cy='318' r='5' fill='#fff' stroke='#ffd45a'/><ellipse cx='100' cy='${tip-24}' rx='${22+p*10}' ry='6' fill='none' stroke='#fff3b8' stroke-width='2.5'/></g>`;

function fx(){
 const p=$('pt');p.innerHTML='';p.className='pt'+(S.lv===10000||S.lv>=100000?' rn':'');
 const n=S.lv>=100000?100:S.lv===10000?80:Math.min(60,S.lv>>1);
 for(let i=0;i<n;i++){const e=document.createElement('i');
  e.style.cssText=`left:${Math.random()*100}%;--d:${3+Math.random()*4}s;--l:${-Math.random()*6}s;--s:${2+Math.random()*4}px`;p.appendChild(e)}
}
function render(){
 const L=S.lv,t=Math.min(10,L/100|0),[h,s]=PAL[t];
 document.documentElement.style.setProperty('--c',t===0?'#9a9ca3':`hsl(${h},${Math.min(100,s+10)}%,62%)`);
 $('sv').innerHTML=sword(L);
 $('lv').textContent='+'+L;$('nm').textContent=(L<1000000&&L!==100000&&L!==10000?'태초의 ':'')+nameOf3(L);
 $('cash').textContent=won(S.cash);$('bar').style.width=(L/1000000*100)+'%';
 const max=L>=1000000;
 $('cost').textContent=max?'—':won(cost(L));
 $('rate').textContent=max?'—':rate(L).toFixed(1)+'%';
 $('des').textContent=max?'—':(dest(L)?dest(L).toFixed(1)+'%':'없음');
 $('sell').textContent=L?won(sellP(L)):'—';
 $('dc').textContent=S.dc+'자루';$('lk').textContent='🍀 '+LUCK.toLocaleString();
 $('go').disabled=busy||max||S.cash<cost(L);
 $('sl').disabled=busy||L===0;
 ['a10','a100','a1000','a10000','a100000','a1000000'].forEach(i=>$(i).disabled=busy||max);$('st').disabled=!autoOn;
 if(L!==lastLv){lastLv=L;fx()}
 if(L===0&&S.cash<cost(0)&&!busy)log('파산했습니다. 처음부터 다시 도전하세요.','bk');
}
function flash(color){const f=$('flash');f.style.background=color;f.classList.remove('on');void f.offsetWidth;f.classList.add('on')}

$('go').onclick=()=>{
 if(busy||S.lv>=1000000)return;const c=cost(S.lv);if(S.cash<c)return;
 S.cash-=c;busy=true;$('stage').classList.add('charge');render();
 setTimeout(()=>{
  $('stage').classList.remove('charge');
  const L=S.lv;
  if(Math.random()*100<rate(L)){
   S.lv++;flash(S.lv>=1000000?'radial-gradient(circle,#fff,#ffd45a 50%,transparent)':'radial-gradient(circle,#fff8,var(--c) 50%,transparent)');
   log(`강화 성공! +${L} → +${S.lv}`,S.lv>=40?'gd':'ok');
   if(S.lv===1000000)log('★ 1000000강 달성 – 신화의 검이 깨어났습니다 ★','gd');
  }else if(Math.random()*100<dest(L)){
   S.dc++;flash('radial-gradient(circle,#ff2a2a88,transparent 70%)');
   log(`검이 산산조각 났습니다… (+${L} 파괴)`,'bk');
   $('stage').classList.add('break');
   setTimeout(()=>{$('stage').classList.remove('break');S.lv=0;busy=false;render()},450);return;
  }else if(L>=10){S.lv--;flash('#0006');log(`강화 실패. +${L} → +${S.lv} 하락`,'no')}
  else{flash('#0006');log(`강화 실패. +${L} 유지`,'no')}
  busy=false;render();
 },200);
};
$('sl').onclick=()=>{if(busy||!S.lv)return;const p=sellP(S.lv);S.cash+=p;log(`+${S.lv} 검을 ${won(p)}에 판매. 새 검을 받았습니다.`,'gd');S.lv=0;render()};
function auto(N){
 if(busy||S.lv>=1000000)return;
 busy=true;autoOn=true;stopFlag=false;
 const a=S.lv,goal=Math.min(1000000,a+N),per=N>=1000000?8000:N>=100000?800:N>=10000?80:N>=1000?8:N>=100?2:1;let tries=0,spent=0;
 const end=msg=>{busy=false;autoOn=false;log(`연속 강화 +${a} → +${S.lv} (${tries}회, 비용 ${won(spent)}) ${msg}`,S.lv>=goal?'gd':'no');if(S.lv>=1000000)log('★ 1000000강 달성 – 신화의 검이 깨어났습니다 ★','gd');flash('radial-gradient(circle,#fff8,var(--c) 50%,transparent)');render()};
 const tick=()=>{
  for(let i=0;i<per;i++){
   if(stopFlag)return end('· 중지');
   if(S.lv>=goal)return end('· 완료');
   const L=S.lv,c=cost(L);
   if(S.cash<c)return end('· 현금 부족으로 중단');
   S.cash-=c;spent+=c;tries++;
   if(Math.random()*100<rate(L))S.lv++;
   else if(Math.random()*100<dest(L)){S.dc++;S.lv=0;log(`검이 산산조각 났습니다… (+${L} 파괴)`,'bk');return end('· 파괴로 중단')}
   else if(L>=10)S.lv--;
  }
  render();setTimeout(tick,30);
 };
 render();tick();
}
$('a10').onclick=()=>auto(10);$('a100').onclick=()=>auto(100);$('a1000').onclick=()=>auto(1000);$('a10000').onclick=()=>auto(10000);$('a100000').onclick=()=>auto(100000);$('a1000000').onclick=()=>auto(1000000);
$('st').onclick=()=>{stopFlag=true};
$('mn2').onclick=()=>{S.cash+=4e71;log('💰 4000무량대수원이 지급되었습니다.','gd');render()};
$('mn').onclick=()=>{S.cash+=4e22;log('💰 400해원이 지급되었습니다.','gd');render()};
$('rs').onclick=()=>{stopFlag=true;setTimeout(init,80)};

init();
</script>
